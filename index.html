<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#8fd3ff">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Говорушка</title>
<style>
:root {
  --sky1: #7cc8ff;
  --sky2: #d8f1ff;
  --hill1: #8fd96b;
  --hill2: #5dbb4a;
  --hill3: #4aa63c;
  --card: #ffffff;
  --ink: #4a3b2a;
  --shadow: 0 .8vmin 0 rgba(30, 60, 90, .15), 0 2vmin 4vmin rgba(30, 60, 90, .18);
  --wood1: #e7b27a;
  --wood2: #c98a4f;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body {
  margin: 0; height: 100%; overflow: hidden; background: var(--sky1); color: var(--ink);
  font-family: ui-rounded, "SF Pro Rounded", system-ui, sans-serif;
  user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
  touch-action: manipulation; overscroll-behavior: none;
}
img { -webkit-user-drag: none; user-select: none; pointer-events: none; display: block; }
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; padding: 0; }

/* ---------- сцена ---------- */
#scene { position: fixed; inset: 0; background: linear-gradient(var(--sky1), var(--sky2) 70%); overflow: hidden; }
#scene .sun { position: absolute; width: 22vmin; top: 3vmin; right: 4vmin; animation: spin 40s linear infinite; }
#scene .cloud { position: absolute; width: 24vmin; opacity: .95; animation: drift linear infinite; }
#scene .c1 { top: 8vh; animation-duration: 70s; animation-delay: -20s; }
#scene .c2 { top: 22vh; width: 16vmin; animation-duration: 95s; animation-delay: -60s; opacity: .8; }
#scene .c3 { top: 4vh; width: 12vmin; animation-duration: 120s; animation-delay: -5s; opacity: .7; }
#scene svg.hills { position: absolute; left: 0; bottom: 0; width: 100%; height: 38vh; }
#scene .deco { position: absolute; width: 9vmin; }
#scene .tree { width: 20vmin; left: 2vw; bottom: 22vh; }
#scene .f1 { left: 30vw; bottom: 3vh; } #scene .f2 { right: 8vw; bottom: 10vh; } #scene .f3 { left: 62vw; bottom: 2vh; width: 7vmin; }
body[data-screen="game"] #scene .deco { opacity: .55; }
body[data-screen="game"] #scene .sun { display: none; }

.screen { position: fixed; inset: 0; display: none; }
body[data-screen="start"] #start, body[data-screen="menu"] #menu, body[data-screen="game"] #game { display: block; }

/* ---------- попугай-ведущий ---------- */
#mascot { position: fixed; z-index: 30; width: 16vmin; height: 16vmin; right: 3vmin; top: max(2vmin, env(safe-area-inset-top));
  transition: all .45s cubic-bezier(.3, 1.4, .5, 1); display: none; }
#mascot img { width: 100%; filter: drop-shadow(0 1vmin 1vmin rgba(0,0,0,.2)); transform-origin: 50% 90%; animation: idle 2.4s ease-in-out infinite; }
body.talking #mascot img { animation: talk .22s ease-in-out infinite alternate; }
body[data-screen="menu"] #mascot, body[data-screen="game"] #mascot { display: block; }
body[data-screen="menu"] #mascot { width: 22vmin; height: 22vmin; right: calc(50% - 11vmin); top: max(3vmin, env(safe-area-inset-top)); }

#homeBtn { position: fixed; z-index: 30; left: 3vmin; top: max(3vmin, env(safe-area-inset-top)); width: 14vmin; height: 14vmin;
  max-width: 96px; max-height: 96px; border-radius: 50%; background: rgba(255,255,255,.9); box-shadow: var(--shadow); display: none; place-items: center; }
#homeBtn img { width: 70%; }
body[data-screen="game"] #homeBtn { display: grid; }

#progress { position: fixed; z-index: 29; left: 50%; transform: translateX(-50%); top: max(4vmin, env(safe-area-inset-top));
  display: none; gap: .6vmin; padding: 1.2vmin 2vmin; background: rgba(255,255,255,.75); border-radius: 99px; }
body[data-screen="game"] #progress.on { display: flex; }
#progress img { width: 4.6vmin; max-width: 34px; opacity: .25; filter: grayscale(1); transition: all .35s cubic-bezier(.3, 1.6, .5, 1); }
#progress img.on { opacity: 1; filter: none; transform: scale(1.2); }

/* ---------- старт ---------- */
#start { display: none; }
body[data-screen="start"] #start { display: grid; place-items: center; }
#start .wrap { display: flex; flex-direction: column; align-items: center; gap: 3vmin; }
#start .parrot { width: 34vmin; animation: idle 2.4s ease-in-out infinite; filter: drop-shadow(0 2vmin 2vmin rgba(0,0,0,.2)); }
#startBtn { width: 30vmin; height: 30vmin; animation: pulse 1.4s ease-in-out infinite; }
#startBtn img { width: 100%; filter: drop-shadow(0 1.5vmin 1.5vmin rgba(0,0,0,.25)); }

/* ---------- меню ---------- */
#menu .tiles { position: absolute; left: 0; right: 0; top: 27vmin; bottom: 3vmin; display: grid; gap: 4vmin; padding: 0 5vmin;
  grid-template-columns: repeat(2, 1fr); grid-auto-rows: 1fr; max-width: 900px; margin: 0 auto; }
.tile { border-radius: 7vmin; box-shadow: var(--shadow); display: grid; place-items: center; position: relative;
  background: radial-gradient(circle at 35% 25%, #fff 0%, var(--tc) 75%); animation: bob 3s ease-in-out infinite; }
.tile:nth-child(2) { animation-delay: -.5s; } .tile:nth-child(3) { animation-delay: -1s; }
.tile:nth-child(4) { animation-delay: -1.5s; } .tile:nth-child(5) { animation-delay: -2s; } .tile:nth-child(6) { animation-delay: -2.5s; }
.tile img { width: min(62%, 22vh); filter: drop-shadow(0 1vmin 1vmin rgba(0,0,0,.18)); }
.tile .badge { position: absolute; width: 38%; right: 6%; bottom: 6%; }
.tile svg { width: min(62%, 22vh); }
.tile:active { animation: none; transform: scale(.93); }

/* ---------- игровое поле ---------- */
#stage { position: absolute; left: 0; right: 0; bottom: 0; top: calc(max(3vmin, env(safe-area-inset-top)) + 16vmin); }

.card { background: var(--card); border-radius: 6vmin; box-shadow: var(--shadow); display: grid; place-items: center; position: relative; }
.card img { width: 74%; filter: drop-shadow(0 1vmin 1vmin rgba(0,0,0,.15)); }
.pop { animation: popin .5s cubic-bezier(.3, 1.6, .5, 1) both; }
.win { animation: win .8s ease both !important; z-index: 5; }
.no { animation: shake .45s ease both !important; }
.hop { animation: hop .5s ease both !important; }
.dim { opacity: .3; transition: opacity .3s; }

/* где кто */
.choice { position: absolute; inset: 0; display: grid; place-content: center; gap: 4vmin; padding: 3vmin;
  grid-template-columns: repeat(var(--cols), var(--cell)); grid-auto-rows: var(--cell); }

/* перетаскивание */
.drag { touch-action: none; cursor: grab; transition: translate .4s cubic-bezier(.3, 1.5, .5, 1); }
.drag.dragging { transition: none; z-index: 50; cursor: grabbing; }
.drag.dragging > * { transform: scale(1.18); filter: drop-shadow(0 3vmin 2.5vmin rgba(0,0,0,.3)); transition: transform .15s; }

/* ферма */
.farm-item { position: absolute; width: 19vmin; height: 19vmin; margin: -9.5vmin 0 0 -9.5vmin; }
.farm-item img { width: 100%; filter: drop-shadow(0 1.2vmin 1vmin rgba(0,0,0,.2)); animation: bob 3s ease-in-out infinite; }
.farm-item .wave { position: absolute; inset: -20%; border-radius: 50%; border: 1vmin solid rgba(255,255,255,.9); animation: wave .8s ease-out forwards; pointer-events: none; }

/* накорми */
.feed-animal { position: absolute; left: 50%; top: 12%; width: 74vmin; height: 74vmin; margin-left: -37vmin; display: grid; place-items: center; }
.feed-animal::before { content: ""; position: absolute; inset: 6%; border-radius: 50%; background: radial-gradient(circle, rgba(255,255,255,.9), rgba(255,255,255,0) 70%); }
.feed-animal img { width: 88%; position: relative; filter: drop-shadow(0 1.5vmin 1.5vmin rgba(0,0,0,.22)); }
.feed-animal.chomp img { animation: chomp .9s ease both; }
.feed-animal.hint::after { content: ""; position: absolute; inset: 0; border-radius: 50%; border: 1.2vmin dashed rgba(255,255,255,.95); animation: spin 8s linear infinite; }
.table { position: absolute; left: 4vw; right: 4vw; bottom: 6vh; height: 30vmin; border-radius: 5vmin;
  background: repeating-linear-gradient(90deg, rgba(0,0,0,.04) 0 2px, transparent 2px 22px), linear-gradient(var(--wood1), var(--wood2));
  box-shadow: var(--shadow); display: flex; align-items: center; justify-content: space-evenly; }
.food { width: 22vmin; height: 22vmin; display: grid; place-items: center; }
.food img { width: 100%; filter: drop-shadow(0 1vmin 1vmin rgba(0,0,0,.25)); }
.food.eaten { transition: all .45s ease-in; opacity: 0; scale: .2; }

/* фигурки */
.wood { position: absolute; left: 0; right: 0; margin: 0 auto; top: 3%; width: var(--ww); padding: 4vmin; border-radius: 5vmin;
  background: repeating-linear-gradient(0deg, rgba(0,0,0,.05) 0 2px, transparent 2px 18px), linear-gradient(var(--wood1), var(--wood2));
  box-shadow: var(--shadow), inset 0 .6vmin 0 rgba(255,255,255,.35); display: flex; flex-wrap: wrap; justify-content: center; gap: 4vmin; }
.hole { width: var(--hs, 24vmin); height: var(--hs, 24vmin); display: grid; place-items: center; }
.hole svg, .piece svg { width: 100%; height: 100%; overflow: visible; }
.pieces { position: absolute; left: 0; right: 0; margin: 0 auto; width: var(--ww); bottom: 5vh; display: flex; justify-content: center; flex-wrap: wrap; gap: 4vmin; }
.piece { width: var(--hs, 24vmin); height: var(--hs, 24vmin); }
.piece svg { filter: drop-shadow(0 1.2vmin 1vmin rgba(0,0,0,.25)); }
.piece.placed { pointer-events: none; }
.piece.placed svg { filter: none; }

/* шарики */
.balloons { position: absolute; inset: 0; display: flex; justify-content: space-evenly; align-items: center; padding: 0 3vw 12vh; }
.balloon { width: var(--bw); height: calc(var(--bw) * 1.7); animation: bob 2.6s ease-in-out infinite; }
.balloon svg { width: 100%; height: 100%; filter: drop-shadow(0 1.5vmin 1.5vmin rgba(0,0,0,.18)); }
.balloon.away { animation: flyaway 1.6s ease-in both !important; }

/* скажи сам */
.say { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5vmin; padding-bottom: 4vmin; }
.say .frame { width: 54vmin; height: 54vmin; border-radius: 8vmin; background: #fff; box-shadow: var(--shadow), inset 0 0 0 2vmin #ffe9a8; display: grid; place-items: center; }
.say .frame img { width: 78%; filter: drop-shadow(0 1.5vmin 1.5vmin rgba(0,0,0,.2)); }
.say .actions { display: flex; gap: 8vmin; }
.round { width: 22vmin; height: 22vmin; max-width: 150px; max-height: 150px; border-radius: 50%; box-shadow: var(--shadow); display: grid; place-items: center; background: #fff; }
.round img { width: 62%; }
.round.rec { background: #ff6b6b; animation: pulse .9s ease-in-out infinite; }
.round[hidden] { display: none; }

/* финиш */
#finish { position: fixed; inset: 0; z-index: 60; display: none; place-items: center; background: rgba(255,250,235,.85); }
body[data-screen="finish"] #finish { display: grid; }
#finish img { width: 50vmin; animation: win 1.2s ease infinite; filter: drop-shadow(0 2vmin 2vmin rgba(0,0,0,.25)); }

.fx { position: fixed; pointer-events: none; z-index: 70; width: 6vmin; height: 6vmin; margin: -3vmin 0 0 -3vmin;
  animation: burst 1.1s cubic-bezier(.2, .8, .4, 1) forwards; }
.fx.dot { width: 2.4vmin; height: 2.4vmin; margin: -1.2vmin 0 0 -1.2vmin; border-radius: .5vmin; }

@keyframes spin { to { rotate: 360deg; } }
@keyframes drift { from { left: -30vmin; } to { left: 110vw; } }
@keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.08); } }
@keyframes idle { 0%,100% { transform: rotate(-4deg); } 50% { transform: rotate(4deg) translateY(-3%); } }
@keyframes talk { from { transform: rotate(-8deg) scale(1); } to { transform: rotate(6deg) scale(1.08) translateY(-4%); } }
@keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-4%); } }
@keyframes popin { from { transform: scale(0) rotate(-12deg); opacity: 0; } to { transform: scale(1); opacity: 1; } }
@keyframes win { 0% { transform: scale(1); } 25% { transform: scale(1.25) rotate(-8deg); } 50% { transform: scale(1.15) rotate(8deg); } 75% { transform: scale(1.2) rotate(-4deg); } 100% { transform: scale(1); } }
@keyframes hop { 0%,100% { transform: translateY(0) scale(1); } 35% { transform: translateY(-22%) scale(1.08, .95); } 70% { transform: translateY(0) scale(1.05, .92); } }
@keyframes shake { 0%,100% { transform: translateX(0); } 20%,60% { transform: translateX(-8%) rotate(-5deg); } 40%,80% { transform: translateX(8%) rotate(5deg); } }
@keyframes chomp { 0%,100% { transform: scale(1); } 20% { transform: scale(1.15, .9); } 40% { transform: scale(.95, 1.08); } 60% { transform: scale(1.12, .92); } 80% { transform: scale(.98, 1.04); } }
@keyframes wave { from { transform: scale(.6); opacity: 1; } to { transform: scale(1.4); opacity: 0; } }
@keyframes flyaway { 0% { transform: translateY(0); } 20% { transform: translateY(3%) scale(1.05); } 100% { transform: translateY(-130vh) rotate(8deg); } }
@keyframes burst { from { transform: translate(0, 0) scale(.4) rotate(0); opacity: 1; } to { transform: translate(var(--dx), var(--dy)) scale(1.1) rotate(var(--r)); opacity: 0; } }

@media (orientation: landscape) {
  #menu .tiles { grid-template-columns: repeat(3, 1fr); top: 26vmin; padding: 0 8vmin 2vmin; }
  .feed-animal { width: 44vmin; height: 44vmin; margin-left: -22vmin; top: 0; }
  .table { height: 26vmin; left: 12vw; right: 12vw; }
  .food { width: 19vmin; height: 19vmin; }
  .say { flex-direction: row; gap: 8vmin; }
  .say .actions { flex-direction: column; }
  .wood { padding: 3vmin; }
}
@media (prefers-reduced-motion: reduce) { #scene .cloud, #scene .sun { animation: none; } }
</style>
</head>
<body data-screen="start">

<div id="scene" aria-hidden="true">
  <img class="sun" src="img/sun.png" alt="">
  <img class="cloud c1" src="img/cloud.png" alt="">
  <img class="cloud c2" src="img/cloud.png" alt="">
  <img class="cloud c3" src="img/cloud.png" alt="">
  <svg class="hills" viewBox="0 0 1000 300" preserveAspectRatio="none">
    <defs>
      <linearGradient id="h1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#a6e57f"/><stop offset="1" stop-color="#7ccd5c"/></linearGradient>
      <linearGradient id="h2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7fd162"/><stop offset="1" stop-color="#4fae3f"/></linearGradient>
    </defs>
    <path d="M0 120 C 160 40 320 60 460 110 C 600 160 760 50 1000 90 L1000 300 L0 300 Z" fill="url(#h1)"/>
    <path d="M0 200 C 200 130 380 150 560 190 C 720 225 860 150 1000 170 L1000 300 L0 300 Z" fill="url(#h2)"/>
  </svg>
  <img class="deco tree" src="img/tree.png" alt="">
  <img class="deco f1" src="img/tulip.png" alt="">
  <img class="deco f2" src="img/sunflower.png" alt="">
  <img class="deco f3" src="img/tulip.png" alt="">
</div>

<button id="mascot" aria-label="Повторить"><img src="img/parrot.png" alt=""></button>
<button id="homeBtn" aria-label="Домой"><img src="img/home.png" alt=""></button>
<div id="progress"></div>

<section id="start" class="screen">
  <div class="wrap">
    <img class="parrot" src="img/parrot.png" alt="">
    <button id="startBtn" aria-label="Играть"><img src="img/play.png" alt=""></button>
  </div>
</section>

<section id="menu" class="screen">
  <div class="tiles">
    <button class="tile" data-mode="farm" style="--tc:#ffd0dc" aria-label="Ферма"><img src="img/cow.png" alt=""><img class="badge" src="img/speaker.png" alt=""></button>
    <button class="tile" data-mode="find" style="--tc:#cfe9ff" aria-label="Где кто"><img src="img/magnifier.png" alt=""></button>
    <button class="tile" data-mode="feed" style="--tc:#ffe6b8" aria-label="Накорми"><img src="img/rabbit.png" alt=""><img class="badge" src="img/carrot.png" alt=""></button>
    <button class="tile" data-mode="sorter" style="--tc:#d9f5c8" aria-label="Фигурки" id="sorterTile"></button>
    <button class="tile" data-mode="balloons" style="--tc:#ead9ff" aria-label="Шарики"><img src="img/balloon.png" alt=""></button>
    <button class="tile" data-mode="say" style="--tc:#ffe0cc" aria-label="Скажи сам"><img src="img/mic.png" alt=""></button>
  </div>
</section>

<section id="game" class="screen"><div id="stage"></div></section>

<div id="finish"><img src="img/trophy.png" alt=""></div>

<script>
'use strict';
const $ = (s, el = document) => el.querySelector(s);
const rnd = n => Math.floor(Math.random() * n);
const pick = a => a[rnd(a.length)];
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = rnd(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const wait = ms => new Promise(r => setTimeout(r, ms));
const store = {
  get(k, d) { try { const v = localStorage.getItem('gov_' + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem('gov_' + k, JSON.stringify(v)); } catch {} },
};
const img = id => `<img src="img/${id}.png" alt="">`;
const praise = () => 'praise_' + (1 + rnd(6));

let C, P, ITEM = {};

/* ================= звук ================= */
const audio = {
  ctx: null, buf: {}, src: null, gen: 0, talking: 0,
  unlock() {
    if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)();
    if (this.ctx.state === 'suspended') this.ctx.resume();
    const s = this.ctx.createBufferSource();
    s.buffer = this.ctx.createBuffer(1, 1, 22050); s.connect(this.ctx.destination); s.start(0);
  },
  load(id) {
    if (this.buf[id]) return this.buf[id];
    const p = fetch('audio/' + id + '.m4a')
      .then(r => { if (!r.ok) throw 0; return r.arrayBuffer(); })
      .then(a => new Promise((ok, no) => this.ctx.decodeAudioData(a, ok, no)));
    this.buf[id] = p;
    p.catch(() => delete this.buf[id]);
    return p;
  },
  talk(on) {
    this.talking = Math.max(0, this.talking + (on ? 1 : -1));
    document.body.classList.toggle('talking', this.talking > 0);
  },
  stop() {
    this.gen++;
    if (this.src) { try { this.src.stop(); } catch {} this.src = null; }
    if (window.speechSynthesis) speechSynthesis.cancel();
  },
  async play(id, keep) {
    if (!keep) this.stop();
    const g = this.gen;
    try {
      const b = await this.load(id);
      if (g !== this.gen) return false;
      await this.playBuffer(b);
    } catch {
      if (g !== this.gen) return false;
      await this.speak(P[id] || '');
    }
    return g === this.gen;
  },
  playBuffer(b, quiet) {
    return new Promise(res => {
      const s = this.ctx.createBufferSource();
      s.buffer = b; s.connect(this.ctx.destination);
      if (!quiet) this.talk(true);
      s.onended = () => { if (this.src === s) this.src = null; if (!quiet) this.talk(false); res(true); };
      this.src = s; s.start(0);
    });
  },
  speak(text) {
    return new Promise(res => {
      if (!window.speechSynthesis || !text) return res(true);
      const u = new SpeechSynthesisUtterance(text);
      u.lang = 'ru-RU'; u.rate = .85;
      this.talk(true);
      u.onend = u.onerror = () => { this.talk(false); res(true); };
      speechSynthesis.speak(u);
    });
  },
  // последовательность фраз; любая новая фраза её прерывает
  async seq(...ids) {
    this.stop();
    const g = this.gen;
    for (const id of ids) {
      if (g !== this.gen) return false;
      await this.play(id, true);
    }
    return g === this.gen;
  },
  preload(ids) {
    let i = 0;
    const next = () => i < ids.length ? this.load(ids[i++]).catch(() => {}).then(next) : null;
    for (let k = 0; k < 4; k++) next();
  },
};

/* ================= эффекты ================= */
function center(el) { const r = el.getBoundingClientRect(); return { x: r.left + r.width / 2, y: r.top + r.height / 2, r }; }
function confetti(el, n = 16, pics = ['star', 'sparkles']) {
  const { x, y } = center(el);
  const colors = ['#ff5a5a', '#ffd23a', '#4cc35a', '#2f8cf0', '#ff8ad8', '#ff9f2e'];
  for (let i = 0; i < n; i++) {
    const usePic = i % 3 === 0;
    const f = document.createElement(usePic ? 'img' : 'div');
    f.className = 'fx' + (usePic ? '' : ' dot');
    if (usePic) f.src = 'img/' + pick(pics) + '.png'; else f.style.background = pick(colors);
    f.style.left = x + 'px'; f.style.top = y + 'px';
    const a = Math.random() * Math.PI * 2, d = innerWidth * (.12 + Math.random() * .22);
    f.style.setProperty('--dx', Math.cos(a) * d + 'px');
    f.style.setProperty('--dy', Math.sin(a) * d + 'px');
    f.style.setProperty('--r', (rnd(720) - 360) + 'deg');
    document.body.appendChild(f);
    setTimeout(() => f.remove(), 1200);
  }
}
function anim(el, cls) { el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); }

/* ================= перетаскивание =================
   Тап (без движения) -> onTap. Перетащили -> onDrop(точка) должен вернуть true,
   если предмет принят; иначе он пружинит обратно. */
function draggable(el, { onTap, onStart, onDrop, free } = {}) {
  el.classList.add('drag');
  el._tx = 0; el._ty = 0;
  let pid = null, sx = 0, sy = 0, bx = 0, by = 0, moved = false;
  el.addEventListener('pointerdown', e => {
    if (pid !== null || el.dataset.locked) return;
    pid = e.pointerId; sx = e.clientX; sy = e.clientY; bx = el._tx; by = el._ty; moved = false;
    try { el.setPointerCapture(pid); } catch {}
  });
  el.addEventListener('pointermove', e => {
    if (e.pointerId !== pid) return;
    const dx = e.clientX - sx, dy = e.clientY - sy;
    if (!moved && Math.hypot(dx, dy) > 10) { moved = true; el.classList.add('dragging'); onStart && onStart(); }
    if (moved) setPos(el, bx + dx, by + dy);
  });
  const end = e => {
    if (e.pointerId !== pid) return;
    pid = null;
    if (!moved) { onTap && onTap(); return; }
    el.classList.remove('dragging');
    const ok = onDrop ? onDrop({ x: e.clientX, y: e.clientY }) : false;
    if (!ok && !free) setPos(el, 0, 0);
  };
  el.addEventListener('pointerup', end);
  el.addEventListener('pointercancel', end);
}
function setPos(el, x, y) { el._tx = x; el._ty = y; el.style.translate = `${x}px ${y}px`; }
// попала ли точка в цель (с запасом — пальчики у малышей неточные)
function hits(pt, target, pad = .35) {
  const r = target.getBoundingClientRect(), px = r.width * pad, py = r.height * pad;
  return pt.x > r.left - px && pt.x < r.right + px && pt.y > r.top - py && pt.y < r.bottom + py;
}
// сдвинуть перетаскиваемый элемент так, чтобы его центр совпал с центром цели
function snapTo(el, target) {
  const a = center(el), b = center(target);
  setPos(el, el._tx + b.x - a.x, el._ty + b.y - a.y);
}

/* ================= рисунки ================= */
let gid = 0;
const SHAPE = {
  circle: '<circle cx="50" cy="50" r="44"/>',
  square: '<rect x="8" y="8" width="84" height="84" rx="10"/>',
  triangle: '<path d="M50 8 Q 54 8 57 13 L 94 82 Q 97 90 88 90 L 12 90 Q 3 90 6 82 L 43 13 Q 46 8 50 8 Z"/>',
  star: '<path d="M50 5 L 61.5 36 L 95 37 L 68.5 57.5 L 78 90 L 50 71 L 22 90 L 31.5 57.5 L 5 37 L 38.5 36 Z" stroke-linejoin="round" stroke-width="6"/>',
  heart: '<path d="M50 90 C 18 66 4 48 6 30 C 8 14 22 6 34 8 C 42 9 47 14 50 21 C 53 14 58 9 66 8 C 78 6 92 14 94 30 C 96 48 82 66 50 90 Z"/>',
};
function shapeSVG(shape, c) {
  const id = 'g' + gid++;
  return `<svg viewBox="0 0 100 100"><defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="${c.hex}"/><stop offset="1" stop-color="${c.dark}"/></linearGradient>
    <clipPath id="${id}c">${SHAPE[shape]}</clipPath></defs>
    <g fill="url(#${id})" stroke="${c.dark}" stroke-width="2">${SHAPE[shape]}</g>
    <ellipse clip-path="url(#${id}c)" cx="36" cy="30" rx="20" ry="10" fill="#fff" opacity=".4" transform="rotate(-25 36 30)"/></svg>`;
}
function holeSVG(shape) {
  return `<svg viewBox="0 0 100 100"><g fill="rgba(80,40,10,.42)" stroke="rgba(80,40,10,.55)" stroke-width="3">${SHAPE[shape]}</g></svg>`;
}
function balloonSVG(c) {
  const id = 'b' + gid++;
  return `<svg viewBox="0 0 100 170"><defs><radialGradient id="${id}" cx="35%" cy="30%" r="75%">
    <stop offset="0" stop-color="#fff" stop-opacity=".85"/><stop offset=".2" stop-color="${c.hex}"/><stop offset="1" stop-color="${c.dark}"/></radialGradient></defs>
    <path d="M50 112 q -9 14 0 28 q 9 14 0 28" stroke="#8d7b62" stroke-width="2.2" fill="none"/>
    <path d="M50 4 C 80 4 96 30 96 54 C 96 82 72 104 50 108 C 28 104 4 82 4 54 C 4 30 20 4 50 4 Z" fill="url(#${id})"/>
    <path d="M44 106 L56 106 L53 115 L47 115 Z" fill="${c.dark}"/>
    <ellipse cx="31" cy="32" rx="8" ry="15" fill="#fff" opacity=".4" transform="rotate(28 31 32)"/></svg>`;
}

/* ================= навигация ================= */
let mode = null, run = 0, idleT = null;
const alive = r => r === run;
function setScreen(s) { document.body.dataset.screen = s; }
function clearIdle() { clearTimeout(idleT); idleT = null; }
function idle(fn, ms = 9000) { clearIdle(); const r = run; idleT = setTimeout(() => alive(r) && fn(), ms); }

const progress = {
  n: 0, goal: 0,
  reset(goal) {
    this.n = 0; this.goal = goal;
    const el = $('#progress'); el.innerHTML = ''; el.classList.toggle('on', goal > 0);
    for (let i = 0; i < goal; i++) el.insertAdjacentHTML('beforeend', img('star'));
  },
  inc() { this.n++; const s = $('#progress').children[this.n - 1]; if (s) s.classList.add('on'); return this.n >= this.goal; },
};

function goMenu() {
  run++; mode = null; clearIdle(); audio.stop(); MODES.say.stopRec();
  setScreen('menu');
}
$('#homeBtn').addEventListener('click', goMenu);
$('#mascot').addEventListener('click', () => {
  anim($('#mascot img'), 'hop');
  if (mode && MODES[mode].repeat) MODES[mode].repeat(); else audio.play('hello');
});
document.querySelectorAll('.tile').forEach(t => t.addEventListener('click', () => {
  const m = t.dataset.mode;
  anim(t, 'hop');
  audio.play('menu_' + m);
  const r = run;
  setTimeout(() => { if (alive(r)) startMode(m); }, 450);
}));

function startMode(m) {
  run++; mode = m; clearIdle();
  setScreen('game');
  $('#stage').innerHTML = '';
  MODES[m].start(run);
}

async function finish(r) {
  clearIdle();
  setScreen('finish');
  confetti($('#finish img'), 30, ['star', 'sparkles', 'party']);
  await audio.play('finish');
  await wait(800);
  if (alive(r)) goMenu();
}

/* ================= режимы ================= */
const MODES = {};

/* --- 1. Ферма: свободная игра, тап = звук, животных можно таскать --- */
MODES.farm = {
  start() {
    progress.reset(0);
    const stage = $('#stage');
    const items = C.items.filter(i => P['sound_' + i.id]);
    const land = innerWidth > innerHeight;
    const cols = land ? 5 : 3, rows = Math.ceil(items.length / cols);
    shuffle(items).forEach((it, k) => {
      const el = document.createElement('div');
      el.className = 'farm-item pop';
      el.style.animationDelay = k * 40 + 'ms';
      const c = k % cols, rr = Math.floor(k / cols);
      const x = (c + .5) / cols * 100 + (Math.random() - .5) * 6;
      const y = (rr + .5) / rows * 92 + (Math.random() - .5) * 4;
      el.style.left = x + '%'; el.style.top = y + '%';
      el.innerHTML = img(it.id);
      el.querySelector('img').style.animationDelay = (-Math.random() * 3) + 's';
      draggable(el, {
        free: true,
        onTap: () => {
          anim(el, 'hop');
          const w = document.createElement('div'); w.className = 'wave'; el.appendChild(w); setTimeout(() => w.remove(), 800);
          audio.seq('name_' + it.id, 'sound_' + it.id);
        },
        onStart: () => audio.play('name_' + it.id),
        onDrop: () => true,
      });
      stage.appendChild(el);
    });
  },
};

/* --- 2. Где кто? --- */
MODES.find = {
  start(r) { this.r = r; this.level = store.get('level_find', 1); this.streak = 0; this.miss = 0; progress.reset(10); this.next(); },
  next() {
    const r = this.r;
    if (!alive(r)) return;
    const n = Math.min(this.level + 1, 4);
    const pool = this.level === 1 ? C.items.filter(i => i.group === 'animal') : C.items;
    const opts = shuffle(pool).slice(0, n);
    // разные картинки с одинаковым словом («мишка») в одном вопросе не нужны
    const t = this.target = pick(opts);
    this.busy = false;
    const land = innerWidth > innerHeight;
    const cols = land ? n : (n <= 2 ? 1 : 2), rows = Math.ceil(n / cols);
    const w = land ? Math.min(94 / n, 44) : 88 / cols, h = land ? 64 : 70 / rows;
    const box = document.createElement('div');
    box.className = 'choice';
    box.style.setProperty('--cols', cols);
    box.style.setProperty('--cell', `min(${w}vw - 3vmin, ${h}vh - 3vmin)`);
    opts.forEach((o, k) => {
      const b = document.createElement('button');
      b.className = 'card pop'; b.style.animationDelay = k * 90 + 'ms';
      b.innerHTML = img(o.id); b.setAttribute('aria-label', o.name);
      b.addEventListener('click', () => this.pick(o, b));
      box.appendChild(b);
    });
    $('#stage').replaceChildren(box);
    this.repeat();
  },
  async repeat() {
    if (this.busy) return;
    const r = this.r;
    if (await audio.seq('where_' + this.target.id) && alive(r)) idle(() => this.repeat());
  },
  async pick(o, el) {
    if (this.busy) return;
    clearIdle();
    const r = this.r, t = this.target;
    if (o.name === t.name) {
      this.busy = true; this.streak++; this.miss = 0;
      if (this.streak >= 3 && this.level < 3) { this.level++; this.streak = 0; store.set('level_find', this.level); }
      el.parentNode.querySelectorAll('.card').forEach(c => c !== el && c.classList.add('dim'));
      anim(el, 'win'); confetti(el);
      const done = progress.inc();
      await audio.seq(praise(), P['sound_' + t.id] ? 'sound_' + t.id : 'name_' + t.id);
      if (!alive(r)) return;
      await wait(300);
      done ? finish(r) : this.next();
    } else {
      this.streak = 0;
      if (++this.miss >= 2 && this.level > 1) { this.level--; this.miss = 0; store.set('level_find', this.level); }
      anim(el, 'no');
      // называем то, что нажал, и спрашиваем снова — ошибка тоже учит слову
      if (await audio.seq('this_' + o.id, 'where_' + t.id) && alive(r)) idle(() => this.repeat());
    }
  },
};

/* --- 3. Накорми зверей (перетаскивание) --- */
MODES.feed = {
  start(r) { this.r = r; this.queue = shuffle(C.feed); progress.reset(this.queue.length); this.next(); },
  next() {
    const r = this.r;
    if (!alive(r)) return;
    const f = this.cur = this.queue[progress.n];
    this.busy = false;
    const others = shuffle(C.feed.filter(x => x !== f).map(x => x.food).concat(['apple', 'strawberry', 'cookie']));
    const level = progress.n < 3 ? 2 : 3;
    const foods = shuffle([f.food, ...others.slice(0, level - 1)]);
    const stage = $('#stage');
    stage.innerHTML = `<div class="feed-animal pop">${img(f.animal)}</div><div class="table"></div>`;
    const animal = $('.feed-animal', stage), table = $('.table', stage);
    animal.addEventListener('click', () => { anim(animal.querySelector('img'), 'hop'); this.repeat(); });
    foods.forEach((id, k) => {
      const el = document.createElement('div');
      el.className = 'food';
      el.innerHTML = `<div class="pop" style="animation-delay:${200 + k * 120}ms">${img(id)}</div>`;
      draggable(el, {
        onTap: () => { anim(el.firstChild, 'hop'); audio.play('name_' + id); },
        onStart: () => { animal.classList.add('hint'); audio.play('name_' + id); },
        onDrop: pt => { animal.classList.remove('hint'); return hits(pt, animal, .1) ? this.drop(id, el, animal) : false; },
      });
      table.appendChild(el);
    });
    this.repeat();
  },
  async repeat() {
    if (this.busy) return;
    if (await audio.seq('feed_ask_' + this.cur.animal) && alive(this.r)) idle(() => this.repeat());
  },
  drop(id, el, animal) {
    const r = this.r, f = this.cur;
    clearIdle();
    if (id !== f.food) {
      anim(animal.querySelector('img'), 'no');
      audio.seq('this_' + id, 'feed_ask_' + f.animal).then(ok => ok && alive(r) && idle(() => this.repeat()));
      return false;
    }
    this.busy = true;
    el.dataset.locked = 1;
    snapTo(el, animal);
    setTimeout(() => el.classList.add('eaten'), 250);
    setTimeout(() => { animal.classList.add('chomp'); confetti(animal, 14, ['star', 'sparkles']); }, 500);
    const done = progress.inc();
    (async () => {
      await wait(400);
      if (!await audio.seq('feed_ok_' + f.animal, praise()) || !alive(r)) return;
      await wait(300);
      done ? finish(r) : this.next();
    })();
    return true;
  },
};

/* --- 4. Фигурки: сортер (перетаскивание) --- */
MODES.sorter = {
  start(r) { this.r = r; progress.reset(6); this.next(true); },
  next(first) {
    const r = this.r;
    if (!alive(r)) return;
    const n = progress.n < 2 ? 2 : progress.n < 4 ? 3 : 4;
    const shapes = shuffle(C.shapes).slice(0, n), colors = shuffle(C.colors);
    const pieces = shapes.map((s, i) => ({ s, c: colors[i % colors.length] }));
    const stage = $('#stage');
    const land = innerWidth > innerHeight;
    const perRow = land ? n : n === 4 ? 2 : n;
    const hs = `min(${land ? 21 : 30}vmin, ${80 / perRow}vw - 7vmin)`;
    stage.style.setProperty('--hs', hs);
    stage.style.setProperty('--ww', `calc(${perRow} * ${hs} + ${perRow - 1} * 4vmin + 8vmin)`);
    stage.innerHTML = '<div class="wood pop"></div><div class="pieces"></div>';
    const wood = $('.wood', stage), tray = $('.pieces', stage);
    const holes = {};
    shuffle(pieces).forEach(p => {
      const h = document.createElement('div'); h.className = 'hole'; h.innerHTML = holeSVG(p.s.id);
      holes[p.s.id] = h; wood.appendChild(h);
    });
    let left = n;
    shuffle(pieces).forEach((p, k) => {
      const el = document.createElement('div');
      el.className = 'piece';
      el.innerHTML = `<div class="pop" style="animation-delay:${250 + k * 110}ms;width:100%;height:100%">${shapeSVG(p.s.id, p.c)}</div>`;
      const word = 'combo_' + p.c.id + '_' + p.s.id;
      draggable(el, {
        onTap: () => { anim(el.firstChild, 'hop'); audio.play(word); },
        onStart: () => audio.play(word),
        onDrop: pt => {
          if (hits(pt, holes[p.s.id], .25)) {
            el.dataset.locked = 1; el.classList.add('placed');
            snapTo(el, holes[p.s.id]);
            confetti(holes[p.s.id], 10);
            if (--left === 0) {
              const done = progress.inc();
              audio.seq(praise(), 'sorter_done').then(async ok => {
                if (!ok || !alive(r)) return;
                await wait(300);
                done ? finish(r) : this.next();
              });
            } else audio.seq(praise());
            return true;
          }
          if (Object.values(holes).some(h => hits(pt, h, 0))) { anim(el.firstChild, 'no'); audio.play('oops'); }
          return false;
        },
      });
      tray.appendChild(el);
    });
    if (first) audio.play('sorter_intro');
  },
  repeat() { audio.play('sorter_intro'); },
};

/* --- 5. Шарики: цвета --- */
MODES.balloons = {
  start(r) { this.r = r; this.level = store.get('level_balloons', 1); this.streak = 0; progress.reset(10); this.next(); },
  next() {
    const r = this.r;
    if (!alive(r)) return;
    this.busy = false;
    const n = Math.min(this.level + 1, 4);
    const cols = shuffle(C.colors).slice(0, n);
    const t = this.target = pick(cols);
    const box = document.createElement('div');
    box.className = 'balloons';
    box.style.setProperty('--bw', `min(${80 / n}vw, 26vmin, 30vh)`);
    cols.forEach((c, k) => {
      const b = document.createElement('button');
      b.className = 'balloon'; b.setAttribute('aria-label', c.m);
      b.style.animationDelay = (-k * .7) + 's';
      b.innerHTML = `<div class="pop" style="animation-delay:${k * 100}ms;width:100%;height:100%">${balloonSVG(c)}</div>`;
      b.addEventListener('click', () => this.pick(c, b));
      box.appendChild(b);
    });
    $('#stage').replaceChildren(box);
    this.repeat();
  },
  async repeat() {
    if (this.busy) return;
    if (await audio.seq('whereball_' + this.target.id) && alive(this.r)) idle(() => this.repeat());
  },
  async pick(c, el) {
    if (this.busy) return;
    clearIdle();
    const r = this.r, t = this.target;
    if (c === t) {
      this.busy = true;
      if (++this.streak >= 3 && this.level < 3) { this.level++; this.streak = 0; store.set('level_balloons', this.level); }
      confetti(el, 12);
      el.classList.add('away');
      const done = progress.inc();
      await audio.seq(praise(), 'ball_' + t.id);
      if (!alive(r)) return;
      done ? finish(r) : this.next();
    } else {
      this.streak = 0;
      anim(el.firstChild, 'no');
      if (await audio.seq('thisball_' + c.id, 'whereball_' + t.id) && alive(r)) idle(() => this.repeat());
    }
  },
};

/* --- 6. Скажи сам: повторение + запись своего голоса --- */
const mic = { stream: null, rec: null, ok: !!(navigator.mediaDevices && window.MediaRecorder) };
MODES.say = {
  start(r) {
    this.r = r; this.list = shuffle(C.items); this.i = 0;
    progress.reset(10);
    $('#stage').innerHTML = `<div class="say"><button class="frame pop" id="sayCard"></button>
      <div class="actions"><button class="round" id="micBtn" aria-label="Записать">${img('mic')}</button>
      <button class="round" id="okBtn" aria-label="Молодец">${img('thumbs')}</button></div></div>`;
    $('#micBtn').hidden = !mic.ok;
    $('#sayCard').addEventListener('click', () => { if (!this.busy) { anim($('#sayCard'), 'hop'); this.repeat(); } });
    $('#okBtn').addEventListener('click', () => { if (!this.busy) { this.stopRec(); this.done(); } });
    $('#micBtn').addEventListener('click', () => this.record());
    this.next();
  },
  next() {
    if (!alive(this.r)) return;
    const it = this.item = this.list[this.i++ % this.list.length];
    this.busy = false;
    const card = $('#sayCard');
    card.innerHTML = img(it.id); card.setAttribute('aria-label', it.name);
    anim(card, 'pop');
    this.repeat();
  },
  repeat() { audio.play('say_' + this.item.id); },
  async done() {
    const r = this.r;
    this.busy = true;
    const card = $('#sayCard');
    anim(card, 'win'); confetti(card);
    const fin = progress.inc();
    if (!await audio.seq(praise()) || !alive(r)) return;
    await wait(300);
    fin ? finish(r) : this.next();
  },
  stopRec() {
    if (mic.rec && mic.rec.state === 'recording') { mic.rec.onstop = null; mic.rec.stop(); }
    const b = $('#micBtn'); if (b) b.classList.remove('rec');
  },
  async record() {
    if (this.busy) return;
    const btn = $('#micBtn'), r = this.r;
    if (mic.rec && mic.rec.state === 'recording') { mic.rec.stop(); return; }
    audio.stop();
    try { if (!mic.stream) mic.stream = await navigator.mediaDevices.getUserMedia({ audio: true }); }
    catch { mic.ok = false; btn.hidden = true; return; }
    const chunks = [], rec = mic.rec = new MediaRecorder(mic.stream);
    rec.ondataavailable = e => e.data.size && chunks.push(e.data);
    rec.onstop = async () => {
      btn.classList.remove('rec');
      if (!alive(r)) return;
      this.busy = true;
      try {
        const blob = new Blob(chunks, { type: rec.mimeType });
        const a = await blob.arrayBuffer();
        const b = await new Promise((ok, no) => audio.ctx.decodeAudioData(a, ok, no));
        if (await audio.seq('your_voice') && alive(r)) {
          await audio.playBuffer(b, true);
          await audio.play('great_talk');
        }
      } catch {}
      if (alive(r)) this.done();
    };
    rec.start();
    btn.classList.add('rec');
    setTimeout(() => { if (rec.state === 'recording') rec.stop(); }, 3000);
  },
};
