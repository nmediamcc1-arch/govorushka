<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#8ed8ff">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Говорушка</title>
<link rel="stylesheet" href="style.css">
</head>
<body data-screen="start">

<div id="scene" aria-hidden="true"></div>

<button id="homeBtn" class="rbtn" aria-label="Назад"></button>
<button id="musicBtn" class="rbtn" aria-label="Музыка"></button>
<button id="mascot" aria-label="Повторить"></button>
<div id="progress"></div>

<section id="start" class="screen">
  <div class="wrap">
    <div class="hero"></div>
    <button id="startBtn" aria-label="Играть"></button>
  </div>
</section>

<section id="menu" class="screen"><div class="tiles"></div></section>

<section id="levels" class="screen"><div class="hero"></div><div class="lv"></div></section>

<section id="game" class="screen"><div id="stage"></div></section>

<div id="finish"></div>
<div id="hand"></div>
<div id="iris"></div>

<script src="art.js"></script>
<script src="sound.js"></script>
<script src="game.js"></script>
</body>
</html>
